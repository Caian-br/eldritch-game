.bar{background:#0002;border-radius:5px;height:9px;overflow:hidden;margin:3px 0}.bar>i{display:block;height:100%;background:var(--ac)}

  </div>

    <div>Condições</div><div>${DECK_COUNTS.condition}</div>
    <div>Feitiços</div><div>${DECK_COUNTS.spell}</div>
    <div>Mito</div><div>${DECK_COUNTS.mythos} — 21 amarelas, 18 verdes, 12 azuis</div>
    <div>Mistérios</div><div>${DECK_COUNTS.mystery} — 4 por Ancião</div>
    <div>Encontros totais</div><div>${DECK_COUNTS.encounter} — incluindo ${DECK_COUNTS.research} Pesquisa, ${DECK_COUNTS.otherWorld} Outro Mundo, ${DECK_COUNTS.expedition} Expedição, ${DECK_COUNTS.special} Especiais</div>
    <div>Monstros</div><div>${DECK_COUNTS.monsterNormal} normais + ${DECK_COUNTS.monsterEpic} épicos</div>
   </div>
  </div>
  <div class="c"><button id="startBtn" type="button" onclick="startInvestigation()">Começar Investigação</button><div id="startHint" class="m">Selecionados: ${sel.inv.length}/${sel.players} investigador${sel.players===1?'':'es'}. Clique no botão para iniciar quando estiver completo.</div></div>`;

function tglInv(i){const p=sel.inv.indexOf(i);if(p>=0)sel.inv.splice(p,1);else if(sel.inv.length<sel.players)sel.inv.push(i);setupUI()}

function startInvestigation(){
 if(!sel || !sel.players || sel.players<1 || sel.players>8){alert('Escolha entre 1 e 8 jogadores.');return;}
 if(sel.inv.length!==sel.players){alert(`Selecione exatamente ${sel.players} investigador${sel.players===1?'':'es'} antes de começar.
Selecionados: ${sel.inv.length}/${sel.players}`);return;}
 try{nw();}catch(err){console.error(err);alert('Não foi possível iniciar a investigação. Erro: '+(err?.message||err));}
}

function nw(){
 const anc=ANC[sel.a];
 const d=[];anc.my.forEach(([g,y,b])=>d.push(...sh([...Array(g).fill('G'),...Array(y).fill('Y'),...Array(b).fill('B')])))
 s={
  anc,
  inv:sel.inv.map((ix,i)=>({...INV[ix],i,mh:INV[ix].hp,ms:INV[ix].sn,at:i===0?1:0,cl:0,tk:[],it:[],im:[0,0,0,0,0],def:0,out:0})),
  players:sel.players,lead:0,acts:2,used:{},moved:0,tkm:0,ph:'act',doom:anc.doom,omen:0,gates:{},mon:{},clues:{},deck:d,mys:0,awake:0,dk:sh([...RES,...RES,...RES]),rs:[],fought:{},over:0,cur:0,lastCard:null,spaceSelected:1
 };
 s.rs=s.dk.splice(0,4);spawnGate();spawnClue();spawnClue();
 $('setup').style.display='none';$('game').style.display='block';render();
}

function log(){}

function spawnMon(c){
 const m=MON[R(MON.length)];
 (s.mon[c]=s.mon[c]||[]).push({n:m[0],hor:m[1],dmg:m[2],res:m[3],mh:m[4],md:m[5],h:0});
}
function spawnGate(){const f=N.map((_,i)=>i).filter(i=>!(i in s.gates)&&N[i].t!=='S');if(!f.length)return;const c=f[R(f.length)];s.gates[c]=R(3);spawnMon(c)}
function spawnClue(){const f=N.map((_,i)=>i).filter(i=>!s.clues[i]&&N[i].t!=='S');if(f.length){const c=f[R(f.length)];s.clues[c]=1}}
function T(v,k,mod=0,cmb=0){
 const b=Math.max(0,...v.it.filter(i=>i.sk==k&&(!i.cmb||cmb)).map(i=>i.b||0));
 const n=Math.max(1,v.sk[k]+v.im[k]+mod+b);let r=Array.from({length:n},()=>1+R(6));
 const o=r.filter(x=>x>=5).length;return o;
}
function hurt(v,h,sn){v.hp=Math.max(0,v.hp-h);v.sn=Math.max(0,v.sn-sn);if(!v.def&&(v.hp<=0||v.sn<=0))defeat(v)}
function heal(v,h,sn){v.hp=Math.min(v.mh,v.hp+h);v.sn=Math.min(v.ms,v.sn+sn)}
function defeat(v){v.def=1;s.doom=Math.max(0,s.doom-1);v.cl=0;v.it=[];v.tk=[];if(s.awake)v.out=1;chk()}
function chk(){
 if(s.doom<=0&&!s.awake){s.doom=0;s.awake=1;}
 if(s.inv.every(v=>v.out))end(0,'Todos os investigadores foram eliminados.');
}
function end(w,t){s.over=1;$('ov').style.display='flex';$('ovt').innerHTML=`<b>${w?'VITÓRIA':'DERROTA'}</b><br>${esc(t)}<br><br><button onclick="document.getElementById('ov').style.display='none';document.getElementById('game').style.display='none';document.getElementById('setup').style.display='block';sel={a:0,players:2,inv:[]};setupUI()">Nova Partida</button>`}
const V=()=>s.inv[s.cur],mons=c=>s.mon[c]||[];
const rtOf=(a,b)=>RT.find(r=>(r[0]===a&&r[1]===b)||(r[0]===b&&r[1]===a));
function nxt(){return s.inv.findIndex((v,i)=>i>s.cur&&!v.def&&!v.out)}
function firstAlive(){return s.inv.findIndex(v=>!v.def&&!v.out)}
function useAct(k){if(s.ph!=='act')return 0;if(s.used[k]){alert('Cada tipo de ação só pode ser feito uma vez por turno nesta versão.');return 0}s.used[k]=1;s.acts--;s.tkm=0;return 1}
function after(){if(s.acts<=0)endAct();render()}
function endAct(){const n=nxt();if(n>=0){s.cur=n;s.acts=2;s.used={};s.moved=0;s.tkm=0}else{s.ph='enc';s.cur=firstAlive();s.fought={};if(s.cur<0)s.ph='myth'}}
function go(c){
 const v=V();if(s.ph!=='act'||s.over)return;const r=rtOf(v.at,c);if(!r){alert('Só é possível viajar para um espaço adjacente.');return}
 if(!s.moved){if(!useAct('trv'))return;s.moved=1;v.at=c;s.tkm=1;after()}
 else if(s.tkm){if(r[2]==='U'){v.at=c;render();return}const t=r[2];const ti=v.tk.indexOf(t);if(ti<0){alert(`Você não tem um bilhete de ${t==='T'?'Trem':'Barco'} para esta rota.`);return}v.tk.splice(ti,1);v.at=c;render()}
}
function rest(){const v=V();if(mons(v.at).length){alert('Não é possível descansar com Monstro no espaço.');return}if(!useAct('rest'))return;heal(v,1,1);after()}
function tick(t){const v=V(),ok=RT.some(r=>(r[0]===v.at||r[1]===v.at)&&r[2]===t);if(!ok){alert('Não há rota desse tipo conectada ao seu espaço.');return}if(!useAct('tk'))return;v.tk.push(t);if(v.tk.length>2)v.tk.shift();after()}
function acq(){const v=V();if(N[v.at].t!=='C'){alert('Só em espaços de Cidade.');return}if(mons(v.at).length){alert('Não é possível com Monstro no espaço.');return}if(!useAct('acq'))return;const o=T(v,1);if(o){const c=s.rs[0];if(c){v.it.push(c);s.rs.shift();if(s.dk.length)s.rs.push(s.dk.shift())}}after()}
function trade(){const v=V();const o=s.inv.find(x=>x!==v&&x.at===v.at&&!x.def&&!x.out);if(!o||!v.cl){alert('Precisa de outro investigador no espaço e de 1 Pista.');return}if(!useAct('trd'))return;v.cl--;o.cl++;after()}
function special(){
 const v=V();if(!useAct('sp'))return;
 if(v.n==='Lily Chen'){const k=Math.min(1,Math.max(0,v.hp-1,v.ms-v.sn));if(k>0){v.hp-=k;v.sn+=k}}
 else if(v.n==='Leo Anderson'){if(T(v,1)){const c=s.rs.find(x=>true);if(c){v.it.push(c);s.rs=s.rs.filter(x=>x!==c);if(s.dk.length)s.rs.push(s.dk.shift())}}}
 else if(v.n==='Jacqueline Fine'){const o=s.inv.find(x=>x!==v&&!x.def&&!x.out);if(o&&v.cl){v.cl--;o.cl++}}
 else if(v.n==='Daisy Walker'){if(N[v.at].t==='C'&&T(v,2)){v.it.push({...SPELL_CARDS[0]});}}
 else if(v.n==='Charlie Kane'){const o=s.inv.find(x=>x!==v&&!x.def&&!x.out);if(o){o.extraAction=(o.extraAction||0)+1}}
 else if(v.n==='Silas Marsh'){const t=RT.find(r=>(r[0]===v.at||r[1]===v.at)&&r[2]==='B');if(t){v.at=t[0]===v.at?t[1]:t[0];s.acts++}}
 else if(v.n==='Jim Culver'){s.inv.filter(x=>x.at===v.at&&!x.def&&!x.out).forEach(x=>x.sn=Math.min(x.ms,x.sn+1))}
 else if(v.n==='Mark Harrigan'){const m=mons(v.at)[0];if(m){m.mh=Math.max(0,m.mh-1)}}
 else if(v.n==='Trish Scarborough'){if(v.cl===0)v.cl=1}
 else if(v.n==='Agnes Baker'){if(T(v,4))v.it.push({...SPELL_CARDS[0]})}
 else if(v.n==='Finn Edwards'){const r=RT.find(r=>(r[0]===v.at||r[1]===v.at)&&(r[2]==='T'||r[2]==='B'));if(r)v.at=r[0]===v.at?r[1]:r[0]}
 else if(v.n==='George Barnaby'){if(T(v,1)){s.inv.filter(x=>x!==v&&!x.def&&!x.out)[0]?.out;}}
 else if(v.n==='Norman Withers'){if(v.cl>=2&&mons(v.at).length){v.cl-=2;s.mon[v.at].shift()}}
 else if(v.n==='Diana Stanley'){const i=mons(v.at).findIndex(m=>m.n==='Cultista');if(i>=0)s.mon[v.at]=[]}
 else if(v.n==='Lola Hayes'){v.im[2]=Math.min(4,v.im[2]+1)}
 else {alert('A habilidade desta ficha é exibida acima; complemente o efeito se quiser automatizar uma regra específica.')}
 after();
}
function fight(){const v=V(),ms=[...mons(v.at)];ms.forEach(m=>{if(v.def)return;const a=T(v,4,m.mh);if(m.hor>a)hurt(v,0,m.hor-a);if(v.def)return;const b=T(v,3,m.md,1);if(m.dmg>b)hurt(v,m.dmg-b,0);m.h+=b;if(m.h>=m.res)s.mon[v.at]=mons(v.at).filter(x=>x!==m)});s.fought[v.i]=1;if(v.def||mons(v.at).length)endEnc();else{s.fought[v.i]=2;render()}}
function encL(){const x=V(),k=(CS[x.at]??({C:2,W:1,U:0,S:4})[N[x.at].t]??0),o=T(x,k);if(o){if(x.im[k]<2)x.im[k]++;else heal(x,1,1)}else hurt(x,0,1);endEnc()}
function encC(){const x=V(),o=T(x,2);if(o){delete s.clues[x.at];x.cl++}else hurt(x,0,1);endEnc()}
function encG(){const x=V(),o=T(x,2,-1);if(o){delete s.gates[x.at];x.cl++}else hurt(x,0,3);endEnc()}
function encM(){const x=V();const targets=[[1,3],[3,3],[8,3]];const ms=s.mys<3?targets[s.mys]:[1,4];if(x.at!==ms[0]||x.cl<ms[1]){alert(`Precisa estar em ${N[ms[0]].n} com ${ms[1]} Pistas.`);return}if(s.mys>=3&&!s.awake){alert('O Mistério Final só existe após o despertar.');return}x.cl-=ms[1];if(s.mys<3){s.mys++;if(s.mys===3&&!s.awake){end(1,`Três Mistérios solucionados. ${s.anc.n} foi banido!`);return}}else{end(1,`Mistério Final solucionado: ${s.anc.finalName}`);return}endEnc()}
function endEnc(){const n=nxt();if(n>=0)s.cur=n;else s.ph='myth';render()}
function myth(){if(!s.deck.length){end(0,'O baralho do Mito acabou.');return}const c=s.deck.shift();s.lastCard=MYTHOS_CARDS[['G','Y','B'].indexOf(c)]||MYTHOS_CARDS[0];if(c!=='Y'){s.omen=(s.omen+1)%3;const n=Object.values(s.gates).filter(g=>g===s.omen).length;s.doom=Math.max(0,s.doom-n)}spawnGate();if(c!=='G'){const m=Object.keys(s.gates).filter(k=>s.gates[k]===s.omen);if(m.length)m.forEach(k=>spawnMon(+k));}spawnClue();if(c==='B')s.inv.forEach(v=>{if(!v.def&&!v.out)hurt(v,0,1)});chk();if(s.over)return;s.inv.forEach(v=>{if(v.def&&!v.out){Object.assign(v,{hp:v.mh,sn:v.ms,def:0,at:0})}});s.lead=(s.lead+1)%s.inv.length;s.ph='act';s.cur=firstAlive();s.acts=2;s.used={};s.moved=0;s.tkm=0;render()}

function cardHtml(c){return `<div class="cardView"><div><div class="ct">${esc(c.type)}</div><div class="cn">${esc(c.name)}</div><div class="cs">${esc(c.subtitle||'')}</div><div class="tx">${esc(c.text)}</div></div><div>${(c.tags||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join('')}<div class="m" style="margin-top:6px">Cópias deste modelo: <b>${esc(c.count)}</b> · Pool: <b>${esc(c.pool)}</b></div></div></div>`}
function renderCards(){
 const groups=[
  ['Recursos',RESOURCE_CARDS],['Artefatos',ARTIFACT_CARDS],['Feitiços',SPELL_CARDS],['Condições',CONDITION_CARDS],
  ['Monstros',MONSTER_CARDS],['Mythos',MYTHOS_CARDS],['Mistérios',MYSTERY_CARDS],['Mistérios Finais',FINAL_MYSTERY_CARDS],
  ['Pesquisa',RESEARCH_CARDS],['Outras pilhas de Encontro',ENCOUNTER_MODEL_CARDS]
 ];
 $('cards').innerHTML=`<h2>Biblioteca de cartas visível</h2><div class="notice">Todos os modelos abaixo podem ser copiados. Para criar uma carta nova, duplique o objeto correspondente no bloco <b>CARD_LIBRARY</b> do código e altere <b>id, name, count e text</b>. Quando a referência fornecida não permite saber a quantidade individual daquela carta, o campo aparece como <b>EDITAR</b>.</div>`+
 groups.map(([title,list])=>`<div class="c"><h3>${esc(title)}</h3><div class="cardGrid">${list.map(cardHtml).join('')}</div></div>`).join('');
}
function renderSpaceInfo(){
 const i=s.spaceSelected||V().at, n=N[i], adj=RT.filter(r=>r[0]===i||r[1]===i).map(r=>`${N[r[0]===i?r[1]:r[0]].n} (${r[2]==='T'?'Trem/Terra':r[2]==='B'?'Barco':'Inexplorado'})`);
 $('spaceInfo').innerHTML=`<h2>Espaço selecionado</h2><div class="kv"><div>Nome</div><div>${esc(n.n)}</div><div>Tipo</div><div>${n.t==='C'?'Cidade':n.t==='W'?'Ermo':n.t==='S'?'Mar':'Espaço de rota'}</div><div>Portal</div><div>${i in s.gates?'Sim':'Não'}</div><div>Pista</div><div>${s.clues[i]?'Sim':'Não'}</div><div>Monstros</div><div>${mons(i).map(m=>m.n).join(', ')||'Nenhum'}</div><div>Adjacências</div><div>${adj.join(' · ')||'—'}</div></div>`;
}
function render(){
 const v=V();
 $('st').innerHTML=`<b>${esc(s.anc.n)}</b> <span class="tag">${s.ph==='act'?'1 · Ação':s.ph==='enc'?'2 · Encontros':'3 · Mito'}</span><br>Perdição: <b>${s.doom}</b>/${s.anc.doom}<div class="bar"><i style="width:${Math.max(0,Math.min(100,100*s.doom/s.anc.doom))}%"></i></div>Presságio: <b>${G[s.omen]} ${OM[s.omen]}</b> · Mistérios: ${s.mys}/3 · Mito restante: ${s.deck.length}<br>${s.awake?'☠ <b>ANCIÃO DESPERTO</b> · ':''}Objetivo: ${s.mys<3?'solucionar 3 Mistérios':(s.awake?s.anc.finalName:'—')}<div class="m">Jogadores: ${s.players} · Chefe: ${esc(s.inv[s.lead].n)} · ${s.ph==='act'?`Vez de ${esc(v.n)}: ${s.acts} ação(ões)`:s.ph==='enc'?`Encontro de ${esc(v.n)}`:''}</div>`;
